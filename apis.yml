aid: coupa-software
name: Coupa Software
description: >-
  Coupa Software is a business spend management (BSM) platform that unifies procurement,
  invoicing, expense management, payments, supplier management, sourcing, contract lifecycle
  management, and supply-chain design into a single cloud suite. The Coupa Core API is a
  RESTful, UTF-8 interface (XML and JSON) that lets integrators create, read, update, and
  take action on individual records — purchase orders, requisitions, invoices, suppliers,
  users, expenses, contracts, receipts and more — within a Coupa instance. Authentication is
  via OAuth 2.0 and OpenID Connect (OIDC); legacy API keys are deprecated. Coupa was acquired
  by Thoma Bravo in 2023 and serves large enterprises worldwide.
